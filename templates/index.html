<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="overlay">

    <div class="main-card">

        <h1 class="title">Breast Cancer Prediction</h1>

        <p class="subtitle">
            AI Powered Healthcare System
        </p>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <input type="number" step="any"
                        class="form-control custom-input"
                        name="mean_radius"
                        placeholder="Mean Radius"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="number" step="any"
                        class="form-control custom-input"
                        name="mean_texture"
                        placeholder="Mean Texture"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="number" step="any"
                        class="form-control custom-input"
                        name="mean_perimeter"
                        placeholder="Mean Perimeter"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="number" step="any"
                        class="form-control custom-input"
                        name="mean_area"
                        placeholder="Mean Area"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="number" step="any"
                        class="form-control custom-input"
                        name="mean_smoothness"
                        placeholder="Mean Smoothness"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <input type="number" step="any"
                        class="form-control custom-input"
                        name="mean_concavity"
                        placeholder="Mean Concavity"
                        required>
                </div>

            </div>

            <div class="text-center mt-4">

                <button type="submit" class="predict-btn">
                    Predict
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
